<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>全球担保平台 - 登录 / 商城 / 商家后台</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .container, .merchant-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      animation: fadeIn 0.8s ease;
      color: #333;
    }
    .products, .orders-page, .merchant-page {
      display: none;
      background: linear-gradient(135deg, #16222a, #3a6073);
      padding: 30px;
      width: 100%;
      min-height: 100vh;
      color: #fff;
    }
    .products {
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      display: grid;
      gap: 20px;
    }
    .product, .order-item {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
    }
    .product img {
      width: 100%;
      border-radius: 12px;
    }
    button {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    input, select {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .switch {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      text-decoration: underline;
    }
    .qrcode-page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      text-align: center;
    }
    .qrcode-page img {
      width: 500px;
      margin-bottom: 15px;
      border-radius: 12px;
    }
    .merchant-buttons button {
      margin-bottom: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style><style>
.qrcode-page p {
  font-size: 50px; /* 字体大小 */
  font-weight: bold; /* 加粗 */
  color: #81b63c; /* 字体颜色（可以根据你的网站风格改） */
  text-align: center; /* 居中 */
  margin-bottom: 20px; /* 标题和下面二维码之间留空 */
}
.qrcode-page p {
  text-align: center;
  font-size: 30px;
}
</style>

</head>

<body>

<!-- 登录注册页面 -->
<div class="container" id="login-box">
  <h2>登录</h2>
  <select id="login-type">
    <option value="user">普通用户登录</option>
    <option value="merchant">商家登录</option>
  </select>
  <input type="text" id="login-username" placeholder="用户名">
  <input type="password" id="login-password" placeholder="密码">
  <button onclick="login()">登录</button>
  <div class="switch" onclick="showRegister()">没有账号？去注册</div>
</div>

<div class="container" id="register-box" style="display:none;">
  <h2>注册</h2>
  <select id="register-type">
    <option value="user">普通用户注册</option>
    <option value="merchant">商家注册</option>
  </select>
  <input type="text" id="register-username" placeholder="用户名">
  <input type="password" id="register-password" placeholder="密码">
  <button onclick="register()">注册</button>
  <div class="switch" onclick="showLogin()">已有账号？去登录</div>
</div>

<!-- 商品展示页面 -->
<div class="products" id="product-page"></div>

<!-- 付款二维码界面 -->
<div class="qrcode-page" id="qrcode-page">
  <h2>认准担保平台收款码</h2>
  <p>请使用TRC20网络进行转账</p>
  <p class="warning-text">扫完码对照二维码下方的地址再确认一次 以免转错！</p>
  <img src="收款码2.jpg" alt="二维码">
  <button onclick="paymentDone()">我已付款</button>
</div>

<!-- 用户订单页面 -->
<div class="orders-page" id="orders-page">
  <h2>我的订单</h2>
  <div id="orders-list"></div>
</div>

<!-- 商家后台页面 -->
<div class="merchant-page" id="merchant-page">
  <h2>欢迎来到商家管理后台</h2>
  <div class="merchant-buttons">
    <button onclick="showAddProduct()">添加新商品</button>
    <button onclick="showMerchantOrders()">查看所有订单</button>
    <button onclick="showMyProducts()">查看/下架商品</button>
    <button onclick="logout()">退出登录</button>
  </div>
  <div id="merchant-content"></div>
</div>

<script>
  let currentUsername = '';
  let currentProduct = '';
  let currentRole = '';

  function showRegister() {
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('register-box').style.display = 'block';
}

function showLogin() {
  document.getElementById('register-box').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  document.getElementById('product-page').style.display = 'none';
  document.getElementById('merchant-page').style.display = 'none';
  document.getElementById('orders-page').style.display = 'none';
  document.getElementById('qrcode-page').style.display = 'none';
}


  function register() {
    const type = document.getElementById('register-type').value;
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value;
    if (!username || !password) {
      alert('请填写完整信息！');
      return;
    }
    localStorage.setItem('user_' + username, JSON.stringify({ username, password, type }));
    alert('注册成功，请登录！');
    showLogin();
  }

  function login() {
  const type = document.getElementById('login-type').value;
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const data = localStorage.getItem('user_' + username);
  if (!data) {
    alert('用户不存在');
    return;
  }
  const user = JSON.parse(data);
  if (user.password !== password || user.type !== type) {
    alert('登录信息错误');
    return;
  }

  // 保存登录状态到 sessionStorage
  sessionStorage.setItem('currentUser', JSON.stringify({ username, type }));

  currentUsername = username;
  currentRole = type;

  if (currentRole === 'user') {
    document.getElementById('login-box').style.display = 'none';
    loadProducts();
    document.getElementById('product-page').style.display = 'grid';
    showOrders(); // 显示订单
  } else {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('merchant-page').style.display = 'block';
  }
}


  function loadProducts() {
    const productPage = document.getElementById('product-page');
    productPage.innerHTML = '';
    const products = JSON.parse(localStorage.getItem('products') || '[]');
    if (products.length === 0) {
      productPage.innerHTML = '<p>暂无商品，等待商家添加！</p>';
      return;
    }
    products.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `<img src="https://via.placeholder.com/250x150?text=${product.name}" alt="${product.name}">
                       <h3>${product.name}</h3>
                       <p>价格：￥${product.price}</p>
                       <button class="buy-button" onclick="buyProduct('${product.name}')">立即购买</button>`;
      productPage.appendChild(div);
    });
  }

  function buyProduct(productName) {
    currentProduct = productName;
    document.getElementById('product-page').style.display = 'none';
    document.getElementById('qrcode-page').style.display = 'flex';
  }

  function paymentDone() {
    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername)) || [];
    orders.push({
      product: currentProduct,
      time: new Date().toLocaleString(),
      status: '待收货'
    });
    localStorage.setItem('orders_' + currentUsername, JSON.stringify(orders));
    showOrders();
  }

  function showOrders() {
    document.getElementById('qrcode-page').style.display = 'none';
    document.getElementById('orders-page').style.display = 'block';
    const ordersList = document.getElementById('orders-list');
    ordersList.innerHTML = '';

    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername)) || [];
    if (orders.length === 0) {
        ordersList.innerHTML = '<p>暂无订单</p>';
    } else {
        orders.forEach((order, index) => {
            const item = document.createElement('div');
            item.className = 'order-item';
            item.innerHTML = `
                <strong>${order.product}</strong><br>
                时间：${order.time}<br>
                状态：${order.status}<br>
                ${
                    order.status === '待收货'
                    ? `<button onclick="confirmReceipt(${index})">确认收货</button>
                       <button onclick="applyReturn(${index})">申请退货</button>`
                    : ''
                }
                <button onclick="deleteUserOrder(${index})">删除订单</button>
            `;
            ordersList.appendChild(item);
        });
    }
}
function applyReturn(index) {
    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername)) || [];
    if (orders[index]) {
        const confirmReturn = confirm('确定要申请退货吗？');
        if (confirmReturn) {
            orders[index].status = '待商家确认退货';
            localStorage.setItem('orders_' + currentUsername, JSON.stringify(orders));
            alert('申请退货成功，请等待商家处理。');
            showOrders(); // 刷新页面
        }
    }
}
function deleteUserOrder(index) {
    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername)) || [];
    orders.splice(index, 1);
    localStorage.setItem('orders_' + currentUsername, JSON.stringify(orders));
    showOrders();
}



  function confirmReceipt(index) {
    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername));
    orders[index].status = '已完成';
    localStorage.setItem('orders_' + currentUsername, JSON.stringify(orders));
    showOrders();
  }

  function deleteUserOrder(index) {
    const orders = JSON.parse(localStorage.getItem('orders_' + currentUsername));
    orders.splice(index, 1);
    localStorage.setItem('orders_' + currentUsername, JSON.stringify(orders));
    showOrders();
  }

  function logout() {
    currentUsername = '';
    currentRole = '';
    showLogin();
    document.getElementById('product-page').style.display = 'none';
    document.getElementById('orders-page').style.display = 'none';
    document.getElementById('merchant-page').style.display = 'none';
  }

  // ===== 商家功能 =====

  function showMyProducts() {
    const products = JSON.parse(localStorage.getItem('products') || '[]');
    const merchantContent = document.getElementById('merchant-content');
    merchantContent.innerHTML = `<h3>我的商品列表</h3>`;
    if (products.length === 0) {
      merchantContent.innerHTML += '<p>您还没有发布商品。</p>';
      return;
    }
    products.forEach((product, index) => {
      merchantContent.innerHTML += `
        <div class="product">
          <h4>${product.name}</h4>
          <p>价格：￥${product.price}</p>
          <button onclick="unlistProduct(${index})">下架商品</button>
        </div>
      `;
    });
  }

  function unlistProduct(index) {
    const products = JSON.parse(localStorage.getItem('products') || '[]');
    products.splice(index, 1);
    localStorage.setItem('products', JSON.stringify(products));
    showMyProducts();
  }

  function showAddProduct() {
    const merchantContent = document.getElementById('merchant-content');
    merchantContent.innerHTML = `
      <h3>添加新商品</h3>
      <input type="text" id="product-name" placeholder="商品名称">
      <input type="number" id="product-price" placeholder="商品价格">
      <button onclick="addProduct()">添加商品</button>
    `;
  }

  function addProduct() {
    const name = document.getElementById('product-name').value.trim();
    const price = document.getElementById('product-price').value.trim();
    if (!name || !price) {
      alert('请填写完整的商品信息！');
      return;
    }
    const newProduct = {
      name: name,
      price: parseFloat(price)
    };
    const products = JSON.parse(localStorage.getItem('products') || '[]');
    products.push(newProduct);
    localStorage.setItem('products', JSON.stringify(products));
    showMyProducts();
    alert('商品添加成功！');
  }

  function showMerchantOrders() {
    const merchantContent = document.getElementById('merchant-content');
    let html = `<h3>所有用户订单</h3>`;
    for (let key in localStorage) {
        if (key.startsWith('orders_')) {
            const userOrders = JSON.parse(localStorage.getItem(key));
            html += `<p><strong>${key.replace('orders_', '')}</strong>的订单：</p>`;
            userOrders.forEach((order, index) => {
                html += `<div class="order-item"><strong>${order.product}</strong><br>时间：${order.time}<br>状态：${order.status}<br>
                    ${order.status === '待商家确认退货' ? `<button onclick="confirmReturn('${key}', ${index})">同意退货</button>` : ''}
                    ${order.status === '已退货' ? `<button onclick="deleteOrder('${key}', ${index})">删除订单</button>` : ''}</div>`;
            });
        }
    }
    merchantContent.innerHTML = html;
}
function confirmReturn(userKey, orderIndex) {
    const orders = JSON.parse(localStorage.getItem(userKey));
    // 修改订单状态为已退货
    orders[orderIndex].status = '已退货';
    localStorage.setItem(userKey, JSON.stringify(orders));
    alert('退货已确认，订单将被删除');
    deleteOrder(userKey, orderIndex); // 删除订单
}
function deleteOrder(userKey, orderIndex) {
    const orders = JSON.parse(localStorage.getItem(userKey));
    orders.splice(orderIndex, 1); // 删除该订单
    localStorage.setItem(userKey, JSON.stringify(orders));
    showMerchantOrders(); // 刷新商家订单列表
}

window.onload = function() {
  const userData = sessionStorage.getItem('currentUser');
  if (userData) {
    const user = JSON.parse(userData);
    currentUsername = user.username;
    currentRole = user.type;

    if (currentRole === 'user') {
      document.getElementById('login-box').style.display = 'none';
      loadProducts();
      document.getElementById('product-page').style.display = 'grid';
      showOrders(); // 显示订单
    } else {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('merchant-page').style.display = 'block';
      document.getElementById('back-button').style.display = 'block';
    }
  } else {
    // 如果没有登录状态，显示登录界面
    showLogin();
  }
}


</script>
